<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <script src="Exe1.js"></script>

    <style>
        body{
            background:#e02ee696;
        }

        form{
            width:30%;
            margin:30px auto;
            background:#e02ee696;
            padding:20px;
            color:white;
            border-radius:10px;
        }

        input, textarea{
            width:60%;
            margin-bottom:15px;
            padding:8px;
        }

        .radio{
            width:auto;
        }

        button{
            padding:8px 15px;
        }
    </style>
</head>
<body>
    
    <form name="nomeform" onsubmit="return validar()">
        <div align="center">
        
        <h2>Formulário Principal</h2>
        
    <label>Nome:</label><br>
    <input type="text" name="nome" id="nome">
    <br/>
    <label>E-mail:</label><br>
    <input type="email" name="email" id="email">
    <br/>
    <label>Comentário:</label><br>
    <textarea name="comentario" id="comentario" rows="5"></textarea>
    
    <br/>

        <h3>Pesquisa</h3>
        
        <p>Primeira vez nesta página?</p>
        
        <input class="radio" type="radio" name="pesquisa" value="sim"> Sim
        
        <input class="radio" type="radio" name="pesquisa" value="nao"> Não
        
        <br><br>
        
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </div>

</form>

</body>
</html>
